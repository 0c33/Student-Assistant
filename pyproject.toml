[project]
name = "student-assistant"
version = "0.1.0"
description = "A framework-free agent harness: a persistent second brain for a university student, over a Markdown vault."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12",
    "python-dotenv>=1.1",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=9.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
